name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov OIDC
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run lint:types
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # The UI pass drives Chromium; the assets it serves are built above.
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:ui

      # The published shape is part of the contract.
      - run: npx publint
      - run: npx attw --pack . --ignore-rules cjs-resolves-to-esm

      - name: Upload coverage
        if: matrix.node == '24'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          use_oidc: true
          files: ./coverage/lcov.info
          fail_ci_if_error: false
