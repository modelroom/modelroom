name: Bug report
description: Something in the server, CLI, or UI does not do what the docs say.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For a **security** issue, do not open a public issue — see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. npx modelroom init demo
        2. npx modelroom serve
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: modelroom version
      description: Output of `npx modelroom --version`.
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version and OS
      placeholder: Node 24.4.0, macOS 15.2
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Server output, browser console errors, anything that helps.
      render: shell
