name: Feature or convention change
description: Propose a capability, or a change to the convention itself.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        modelroom is deliberately small. The strongest proposals say what the room cannot express
        today, and why the answer belongs here rather than in the artifact or the implementation.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you unable to do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: The behaviour, the files it touches, and what stays out of scope.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - convention (BRIEF / SPEC / BEHAVIOUR / artifact)
        - server / API
        - CLI
        - UI
        - agent adapters
        - docs
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
