# Fast local gates. CI runs the same tools on everything; this just keeps
# staged work clean before it leaves the machine.

pre-commit:
  parallel: true
  jobs:
    - name: oxlint
      glob: '*.{ts,mts,cts,js,mjs,cjs}'
      run: npx oxlint --fix {staged_files}
    - name: oxfmt
      glob: '*.{ts,mts,cts,js,mjs,cjs,json,jsonc,html,css}'
      exclude:
        - 'ui/**'
        - 'examples/**'
        - 'templates/**'
        - 'package-lock.json'
      run: npx oxfmt --no-error-on-unmatched-pattern {staged_files}

pre-push:
  jobs:
    - name: typecheck
      run: npm run typecheck
