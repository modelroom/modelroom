<!doctype html>
<!-- modelroom — a room: chat · docs · artifact, one screen at a time.
     The shell is static; the app itself lives in client/ and is built to
     /ui/assets/app.js (committed). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room — modelroom</title>
<link rel="stylesheet" href="/ui/modelroom.css">
<script>
// Theme before paint: Mantine reads `data-mantine-color-scheme`, so the first
// frame is already the right colour and nothing flashes on load.
try {
  var stored = localStorage.getItem('modelroom.theme');
  document.documentElement.setAttribute(
    'data-mantine-color-scheme',
    stored
      ? JSON.parse(stored)
      : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'),
  );
} catch (error) { /* Mantine falls back to the OS preference */ }
</script>
</head>
<body>
<div id="root" data-app="room" class="mr-app mr-app-fixed"></div>
<script type="module" src="/ui/assets/app.js"></script>
</body>
</html>
