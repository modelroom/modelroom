<!doctype html>
<!-- modelroom — a room: chat · docs · artifact, one screen at a time -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room — modelroom</title>
<link rel="stylesheet" href="/ui/modelroom.css">
</head>
<body class="h-dvh overflow-hidden bg-base-200 text-base-content font-sans flex flex-col">

<div class="navbar min-h-12 bg-base-100 border-b border-base-300 px-3">
  <div class="flex-1 gap-2 min-w-0">
    <a class="btn btn-ghost btn-sm" href="/">← Rooms</a>
    <span class="font-semibold truncate" id="title">…</span>
    <span class="badge badge-sm font-mono opacity-70" id="roomName"></span>
    <span id="statusBadge"></span>
  </div>
  <div class="flex-none flex items-center gap-2">
    <span class="text-xs opacity-60 font-mono hidden md:inline" id="sessionLabel"></span>
    <button class="btn btn-ghost btn-xs" id="sessionToggle" title="セッション情報">セッション</button>
    <button class="btn btn-ghost btn-xs" id="newSession">new session</button>
    <span class="badge" id="conn" data-phase="idle"><span class="loading loading-dots loading-xs hidden" id="spinner"></span><span id="statusText">ready</span></span>
  </div>
</div>

<main id="cols" class="flex-1 min-h-0 grid grid-cols-1 lg:grid-cols-[340px_minmax(240px,1fr)_minmax(300px,1.1fr)_320px]">

  <!-- chat -->
  <section class="min-w-0 min-h-0 flex flex-col border-r border-base-300">
    <header class="flex items-center gap-2 px-3 py-2 border-b border-base-300 bg-base-100">
      <span class="text-sm font-medium">Chat</span>
      <span class="text-xs opacity-60 font-mono truncate" id="agentLabel"></span>
    </header>
    <div class="flex-1 overflow-auto p-3 flex flex-col gap-2 mr-scroll" id="messages"></div>
    <div class="border-t border-base-300 p-2 bg-base-100 flex gap-2">
      <textarea class="textarea textarea-bordered flex-1 text-sm" rows="3" id="prompt"
        placeholder="Ask the agent to change this room. It edits the room's files; the artifact updates here."></textarea>
      <button class="btn btn-primary self-end" id="send">Send</button>
    </div>
  </section>

  <!-- docs -->
  <section class="min-w-0 min-h-0 flex flex-col border-r border-base-300">
    <header class="flex items-center gap-2 px-3 py-1.5 border-b border-base-300 bg-base-100 overflow-x-auto">
      <div class="tabs tabs-box tabs-xs" id="docTabs"></div>
      <span class="ml-auto text-xs" id="saveState"></span>
    </header>
    <div class="flex-1 min-h-0 relative" id="docPanes"></div>
  </section>

  <!-- artifact -->
  <section class="min-w-0 min-h-0 flex flex-col">
    <header class="flex flex-wrap items-center gap-2 px-3 py-1.5 border-b border-base-300 bg-base-100">
      <div class="join">
        <button class="btn btn-xs join-item" data-device="sp">sp 390</button>
        <button class="btn btn-xs join-item btn-active" data-device="tablet">tablet 1024</button>
        <button class="btn btn-xs join-item" data-device="pc">pc 1280</button>
      </div>
      <label class="label cursor-pointer gap-2 py-0"><input type="checkbox" class="checkbox checkbox-xs" id="fit" checked><span class="label-text text-xs">fit</span></label>
      <div class="tabs tabs-box tabs-xs">
        <button class="tab tab-active" data-view="artifact">artifact</button>
        <button class="tab" data-view="png">png</button>
      </div>
      <button class="btn btn-xs" id="render">make png</button>
      <a class="btn btn-xs btn-ghost ml-auto" id="openRaw" target="_blank" rel="noopener">open raw ↗</a>
    </header>
    <div class="flex-1 min-h-0 overflow-auto p-3" id="stage">
      <div class="mx-auto relative" id="stageInner">
        <div class="absolute top-0 left-0 origin-top-left rounded-box overflow-hidden border border-base-300 bg-base-100 shadow-sm" id="frame">
          <iframe id="view" class="block w-full h-full border-0 bg-white" title="artifact"></iframe>
        </div>
      </div>
      <img id="png" class="hidden w-full rounded-box border border-base-300 bg-base-100" alt="artifact thumbnail">
      <div id="noArtifact" class="hidden text-sm opacity-70"></div>
    </div>
  </section>

  <!-- session: what the agent did in this room (opencode) -->
  <section id="sessionPanel" class="min-w-0 min-h-0 flex flex-col border-l border-base-300 bg-base-100">
    <header class="flex items-center gap-2 px-3 py-2 border-b border-base-300 bg-base-100">
      <span class="text-sm font-medium">セッション</span>
      <button class="btn btn-ghost btn-xs ml-auto" id="sessionRefresh" title="更新">refresh</button>
    </header>
    <div class="flex-1 min-h-0 overflow-auto p-3 flex flex-col gap-3" id="sessionBody"></div>
  </section>
</main>

<script>
'use strict';
const DEVICE_WIDTH = { sp: 390, tablet: 1024, pc: 1280 };
const $ = (id) => document.getElementById(id);
const room = decodeURIComponent(location.pathname.replace(/^\/room\//, '').split('?')[0]);
const view = $('view'), stage = $('stage'), frame = $('frame');

const st = { device: 'tablet', fit: true, session: null, running: false, docs: [], artifact: 'index.html', thumb: null };
const docs = {};
let pendingScroll = null, reloadTimer = null, chatEl = null;

const now = (ms) => new Date(ms || Date.now()).toLocaleTimeString();
const setConn = (phase, message) => {
  $('conn').dataset.phase = phase;
  $('statusText').textContent = message;
  $('spinner').classList.toggle('hidden', !(phase === 'chat' || phase === 'rendering'));
};
function say(kind, text) {
  const el = document.createElement('div');
  el.className = kind === 'user'
    ? 'chat chat-end'
    : kind === 'meta' ? 'text-xs opacity-60 font-mono mr-prose'
    : 'chat chat-start';
  el.innerHTML = kind === 'user'
    ? `<div class="chat-bubble chat-bubble-primary text-sm mr-prose">${escapeHtml(text)}</div>`
    : kind === 'meta' ? escapeHtml(text) : `<div class="chat-bubble text-sm mr-prose">${escapeHtml(text)}</div>`;
  $('messages').appendChild(el);
  $('messages').scrollTop = $('messages').scrollHeight;
  return el;
}
const escapeHtml = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

/* ── docs ─────────────────────────────────────────────────────────────── */
function buildDocs() {
  $('docTabs').innerHTML = st.docs.map((n, i) =>
    `<button class="tab ${i === 0 ? 'tab-active' : ''}" data-doc="${n}">${n.replace(/\.md$/, '')}</button>`).join('');
  $('docPanes').innerHTML = st.docs.map((n, i) => `
    <div class="absolute inset-0 flex-col ${i === 0 ? 'flex' : 'hidden'}" data-pane="${n}">
      <textarea class="textarea flex-1 w-full h-full rounded-none border-0 focus:outline-none mr-doc-area p-4" spellcheck="false" data-area="${n}"></textarea>
    </div>`).join('');

  for (const name of st.docs) {
    const pane = document.querySelector(`[data-pane="${name}"]`);
    const ta = pane.querySelector('textarea');
    docs[name] = { text: '', mtime: 0, dirty: false, ta };
    let t = null;
    ta.addEventListener('input', () => {
      docs[name].dirty = true;
      $('saveState').textContent = `${name}: unsaved…`;
      clearTimeout(t); t = setTimeout(() => saveDoc(name), 700);
    });
  }
  $('docTabs').addEventListener('click', (e) => {
    const b = e.target.closest('[data-doc]');
    if (!b) return;
    document.querySelectorAll('#docTabs .tab').forEach((x) => x.classList.toggle('tab-active', x === b));
    document.querySelectorAll('[data-pane]').forEach((p) => p.classList.toggle('hidden', p.dataset.pane !== b.dataset.doc));
  });
}

async function loadDoc(name, force) {
  const d = docs[name]; if (!d) return;
  const data = await (await fetch(`/api/doc?room=${encodeURIComponent(room)}&name=${encodeURIComponent(name)}`)).json();
  if (data.error) { $('saveState').textContent = data.error; return; }
  if (d.dirty && !force) return;                        // don't clobber what you are typing
  d.text = data.text; d.mtime = data.mtime; d.dirty = false;
  d.ta.value = data.text;
  $('saveState').textContent = `${name}: saved ${now(data.mtime)}`;
}
async function saveDoc(name) {
  const d = docs[name]; if (!d || !d.dirty) return;
  const res = await fetch('/api/doc', {
    method: 'PUT', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ room, name, text: d.ta.value, mtime: d.mtime }),
  });
  const data = await res.json();
  if (res.status === 409) {
    const keep = confirm(`${name} changed somewhere else.\n\nOK = take the other version (your edits are lost)\nCancel = overwrite with yours`);
    if (keep) await loadDoc(name, true);
    else { d.mtime = data.mtime; await saveDoc(name); }
    return;
  }
  if (!res.ok) { $('saveState').textContent = `failed: ${data.error || res.status}`; return; }
  d.mtime = data.mtime; d.dirty = false;
  $('saveState').textContent = `${name}: saved ${now(data.mtime)}`;
}

/* ── artifact ─────────────────────────────────────────────────────────── */
function fitFrame() {
  const w = DEVICE_WIDTH[st.device] || 1024;
  const scale = st.fit ? Math.min(1, Math.max(0.2, (stage.clientWidth - 24) / w)) : 1;
  let h = 0;
  try { h = view.contentDocument.documentElement.scrollHeight; } catch { /* not loaded yet */ }
  if (!h) h = Math.max(420, stage.clientHeight - 24);
  frame.style.width = w + 'px'; frame.style.height = h + 'px';
  frame.style.transform = `scale(${scale})`;
  stage.style.setProperty('aspect-ratio', 'auto');
  $('stageInner').style.width = Math.round(w * scale) + 'px';
  $('stageInner').style.height = Math.round(h * scale) + 'px';
}
function loadArtifact(keepScroll = true) {
  try { pendingScroll = keepScroll ? (view.contentWindow.scrollY || 0) : 0; } catch { pendingScroll = 0; }
  view.src = `/files/${st.roomsPath}/${room}/${st.artifact}?v=${Date.now()}`;
}
view.addEventListener('load', () => {
  fitFrame();
  if (pendingScroll !== null) { try { view.contentWindow.scrollTo(0, pendingScroll); } catch { /* ignore */ } pendingScroll = null; }
});
window.addEventListener('resize', fitFrame);

/* ── events ───────────────────────────────────────────────────────────── */
const es = new EventSource('/events');
es.addEventListener('status', (e) => { const d = JSON.parse(e.data); setConn(d.phase, d.message); });
es.addEventListener('change', (e) => {
  const d = JSON.parse(e.data);
  if (!d.file.startsWith(st.roomsPath + '/' + room + '/')) return;
  const name = d.file.split('/').pop();
  if (st.docs.includes(name)) { loadDoc(name, false); return; }
  clearTimeout(reloadTimer);
  reloadTimer = setTimeout(() => {
    if (name.endsWith('.png')) { refreshPng(); return; }
    if (name === st.artifact) loadArtifact(true);
  }, 150);
});
es.addEventListener('chat-start', (e) => {
  const d = JSON.parse(e.data);
  if (d.room !== room) return;
  st.running = true; chatEl = null; $('send').disabled = true;
  say('meta', `$ agent running (session ${String(d.sessionId).slice(0, 18)}…)`);
});
es.addEventListener('chat', (e) => {
  const d = JSON.parse(e.data);
  if (d.room !== room) return;
  if (!chatEl) chatEl = say('assistant', '');
  chatEl.querySelector('.chat-bubble').textContent += d.chunk;
  $('messages').scrollTop = $('messages').scrollHeight;
});
es.addEventListener('chat-done', (e) => {
  const d = JSON.parse(e.data);
  if (d.room !== room) return;
  st.running = false; chatEl = null; $('send').disabled = false;
  say('meta', `— agent exited (${d.code})${d.error ? ': ' + d.error : ''}`);
  st.docs.forEach((n) => loadDoc(n, false));
  loadRoom();
  loadSession();
});
es.addEventListener('render-done', (e) => {
  const d = JSON.parse(e.data);
  if (d.room && d.room !== room) return;
  if (d.ok) refreshPng(); else say('meta', d.error || 'render failed');
});
es.addEventListener('error', () => setConn('error', 'disconnected — retrying'));

/* ── prompt history + draft ───────────────────────────────────────────── */
// ↑/↓ walk the prompts you sent (per room). The text you were writing is kept
// as a draft — in memory and in localStorage — so it comes back when you pass
// the newest entry, and survives a reload.
const HIST_KEY = `modelroom.history.${room}`;
const DRAFT_KEY = `modelroom.draft.${room}`;
const HIST_MAX = 50;
const storeGet = (k, fallback) => {
  try { return JSON.parse(localStorage.getItem(k) ?? 'null') ?? fallback; } catch { return fallback; }
};
const storeSet = (k, v) => {
  try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch { /* storage off */ }
};
const history = storeGet(HIST_KEY, []);
let histIndex = null;                 // null = editing the draft; otherwise an index into history
let draft = storeGet(DRAFT_KEY, '');

function rememberPrompt(text) {
  if (!text) return;
  if (history[history.length - 1] !== text) history.push(text);
  if (history.length > HIST_MAX) history.splice(0, history.length - HIST_MAX);
  storeSet(HIST_KEY, history);
}
function saveDraft(text) { draft = text; storeSet(DRAFT_KEY, text || null); }
function setPrompt(text) {
  const ta = $('prompt');
  ta.value = text;
  ta.selectionStart = ta.selectionEnd = text.length;
  ta.scrollTop = ta.scrollHeight;
}
function browseHistory(e) {
  const ta = e.target;
  if (e.key === 'ArrowUp') {
    // Only take over the key when the caret is on the first line: multiline editing still works.
    const onFirstLine = ta.selectionStart === ta.selectionEnd && !ta.value.slice(0, ta.selectionStart).includes('\n');
    if (!history.length || (histIndex === null && !onFirstLine)) return;
    e.preventDefault();
    if (histIndex === null) { saveDraft(ta.value); histIndex = history.length; }
    if (histIndex > 0) { histIndex -= 1; setPrompt(history[histIndex]); }
    return;
  }
  if (e.key === 'ArrowDown' && histIndex !== null) {
    e.preventDefault();
    if (histIndex < history.length - 1) { histIndex += 1; setPrompt(history[histIndex]); }
    else { histIndex = null; setPrompt(draft); }
  }
}

/* ── actions ──────────────────────────────────────────────────────────── */
async function send() {
  const ta = $('prompt');
  const prompt = ta.value.trim();
  if (!prompt || st.running) return;
  say('user', prompt);
  ta.value = '';
  histIndex = null;
  saveDraft('');
  rememberPrompt(prompt);
  const res = await fetch('/api/chat', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ room, prompt }) });
  const data = await res.json();
  if (!res.ok) say('meta', `cannot send: ${data.reason || data.error || res.status}`);
}
$('send').addEventListener('click', send);
$('prompt').addEventListener('input', () => { histIndex = null; saveDraft($('prompt').value); });
$('prompt').addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); send(); return; }
  browseHistory(e);
});
$('newSession').addEventListener('click', async () => {
  if (st.running) { alert('the agent is running'); return; }
  if (!confirm('Start a new session for this room? The conversation context resets.')) return;
  const res = await fetch('/api/session', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ room }) });
  const data = await res.json();
  if (res.ok) { st.session = data.sessionId; $('sessionLabel').textContent = `session ${String(st.session).slice(0, 16)}…`; say('meta', 'new session started'); }
});
document.querySelectorAll('[data-device]').forEach((b) => b.addEventListener('click', () => {
  st.device = b.dataset.device;
  document.querySelectorAll('[data-device]').forEach((x) => x.classList.toggle('btn-active', x === b));
  fitFrame();
}));
$('fit').addEventListener('change', (e) => { st.fit = e.target.checked; fitFrame(); });
document.querySelectorAll('[data-view]').forEach((b) => b.addEventListener('click', () => {
  document.querySelectorAll('[data-view]').forEach((x) => x.classList.toggle('tab-active', x === b));
  const png = b.dataset.view === 'png';
  $('stageInner').classList.toggle('hidden', png);
  $('png').classList.toggle('hidden', !png);
  if (!png) fitFrame();
}));
$('render').addEventListener('click', async () => {
  const res = await fetch('/api/artifact', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ room, device: st.device }) });
  const data = await res.json();
  if (!res.ok) say('meta', data.error || `render failed (${res.status})`);
  else refreshPng();
});
function refreshPng() {
  const img = $('png');
  if (!st.hasThumb) { img.removeAttribute('src'); img.classList.add('hidden'); return; }
  img.src = `/files/${st.roomsPath}/${room}/${st.artifact.replace(/\.html?$/i, '.png')}?v=${Date.now()}`;
}

/* ── session panel ────────────────────────────────────────────────────── */
// Two grid templates, both written out so Tailwind keeps them: the 4th column
// is the session panel. Collapsing swaps the template and hides the section.
const COLS_CLOSED = 'lg:grid-cols-[340px_minmax(280px,1fr)_minmax(360px,1.15fr)]';
const COLS_OPEN = 'lg:grid-cols-[340px_minmax(240px,1fr)_minmax(300px,1.1fr)_320px]';
let sessionOpen = true;

const fmtNum = (n) => {
  if (n === null || n === undefined) return '—';
  if (n >= 1_000_000) return (n / 1_000_000).toFixed(2) + 'M';
  if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
  return String(n);
};
const bar = (pct) => {
  const color = pct >= 85 ? 'bg-error' : pct >= 70 ? 'bg-warning' : 'bg-success';
  return `<div class="h-2 w-full rounded-full bg-base-300 overflow-hidden"><div class="${color} h-full" style="width:${Math.max(0, Math.min(100, pct))}%"></div></div>`;
};
const rowHtml = (label, value) =>
  `<div class="flex items-baseline justify-between gap-2 text-sm"><span class="opacity-70">${escapeHtml(label)}</span><span class="font-mono text-right break-all">${escapeHtml(String(value))}</span></div>`;
const headHtml = (t) => `<div class="text-xs uppercase tracking-wide opacity-60">${escapeHtml(t)}</div>`;

function setSessionOpen(open) {
  sessionOpen = open;
  $('cols').classList.toggle(COLS_OPEN, open);
  $('cols').classList.toggle(COLS_CLOSED, !open);
  $('sessionPanel').classList.toggle('hidden', !open);
  $('sessionPanel').classList.toggle('flex', open);
}

function renderSession(d) {
  const body = $('sessionBody');
  if (!d || !d.available) {
    body.innerHTML = '<div class="text-sm opacity-70">この部屋のセッション情報は opencode アダプタのときだけ表示します。</div>';
    return;
  }
  const out = [];
  const s = d.stats || {}, t = s.tokens;
  out.push(headHtml('セッション'));
  if (d.context) {
    out.push(`<div class="flex items-baseline justify-between gap-2 text-sm"><span class="opacity-70">コンテキスト</span><span class="font-mono">${d.context.pct}% ・ ${fmtNum(d.context.used)}</span></div>`);
    out.push(bar(d.context.pct));
    if (d.context.pct >= 70) out.push(`<div class="text-xs text-warning">${d.context.pct}% — compact を検討（上限 ${fmtNum(d.context.limit)}）</div>`);
  } else {
    out.push('<div class="text-xs opacity-60">コンテキスト: 計測できません（まだ実行がないか、上限が不明）</div>');
  }
  out.push(rowHtml('費用', s.cost != null ? '$' + Number(s.cost).toFixed(4) : '—'));
  if (t) {
    const total = t.input + t.cacheRead;
    const cached = total > 0 ? Math.round((t.cacheRead / total) * 100) : 0;
    out.push(rowHtml('トークン ↑', fmtNum(t.input)));
    out.push(rowHtml('トークン ↓', fmtNum(t.output)));
    out.push(rowHtml('reasoning', fmtNum(t.reasoning)));
    out.push(rowHtml('キャッシュ', cached + '%'));
  }
  out.push(rowHtml('状態', s.outcome || '—'));
  if (s.model) out.push(rowHtml('model', s.model));
  if (d.workspace) out.push(rowHtml('workspace', d.workspace));
  if (d.mcp && d.mcp.length) {
    out.push(headHtml('MCP'));
    for (const m of d.mcp) out.push(rowHtml(m.name, m.error ? `${m.status}: ${m.error}` : m.status));
  }
  if (d.skills && d.skills.length) out.push(rowHtml('スキル', String(d.skills.length)));
  body.innerHTML = out.join('');
}

function renderTranscript(lines) {
  if (!lines || !lines.length) return;
  for (const l of lines) {
    say(l.role === 'assistant' ? 'assistant' : l.role === 'user' ? 'user' : 'meta', l.text);
  }
  say('meta', `— このセッションを再開（${lines.length} 行）`);
}

async function loadSession({ transcript = false } = {}) {
  let d = null;
  try { d = await (await fetch(`/api/session?room=${encodeURIComponent(room)}`)).json(); } catch { return null; }
  renderSession(d);
  if (transcript) renderTranscript(d.lines);
  if (d && d.session) { st.session = d.session; $('sessionLabel').textContent = `session ${String(d.session).slice(0, 16)}…`; }
  return d;
}

$('sessionToggle').addEventListener('click', () => setSessionOpen(!sessionOpen));
$('sessionRefresh').addEventListener('click', () => loadSession());

/* ── init ─────────────────────────────────────────────────────────────── */
async function loadRoom() {
  const data = await (await fetch(`/api/room?room=${encodeURIComponent(room)}`)).json();
  if (data.error) { $('title').textContent = data.error; return; }
  const r = data.room;
  $('title').textContent = r.title || r.name;
  $('roomName').textContent = `${data.config.rooms}/${r.name}`;
  if (r.status) {
    const cls = /adopt|approv|done/i.test(r.status) ? 'badge-success' : /review/i.test(r.status) ? 'badge-warning' : 'badge-ghost';
    $('statusBadge').innerHTML = `<span class="badge badge-sm ${cls}">${r.status}</span>`;
  }
  st.roomsPath = data.config.rooms;
  st.artifact = data.config.artifact;
  st.session = data.session;
  $('sessionLabel').textContent = st.session ? `session ${String(st.session).slice(0, 16)}…` : '';
  const a = data.config.agent;
  $('agentLabel').textContent = `${a.adapter} · ${a.command}${a.model ? ' · ' + a.model : ''}`;
  $('openRaw').href = `/files/${data.config.rooms}/${r.name}/${data.config.artifact}`;
  const exists = r.hasArtifact;
  st.hasThumb = Boolean(r.hasThumb);
  $('noArtifact').classList.toggle('hidden', exists);
  if (!exists) $('noArtifact').textContent = `No artifact yet (${data.config.artifact}). Ask the agent to create it.`;
  $('stageInner').classList.toggle('hidden', !exists);
}

(async function init() {
  await loadRoom();
  const data = await (await fetch(`/api/room?room=${encodeURIComponent(room)}`)).json();
  st.docs = data.config.docs;
  buildDocs();
  await Promise.all(st.docs.map((n) => loadDoc(n, true)));
  loadArtifact(false);
  refreshPng();
  if (draft) $('prompt').value = draft;
  say('meta', `room ${room} — this chat runs your agent in ${data.config.root}`);
  await loadSession({ transcript: true });
})();
</script>
</body>
</html>
