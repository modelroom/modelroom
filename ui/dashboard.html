<!doctype html>
<!-- modelroom — dashboard: every room, narrowed by what the records say.
     The shell is static; the app lives in web/ and is built to /ui/assets/app.js. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>modelroom</title>
<link rel="stylesheet" href="/ui/modelroom.css">
<script>
// Theme before paint: the bundle is React, but the first frame should not flash.
try {
  var stored = localStorage.getItem('modelroom.theme');
  document.documentElement.dataset.theme = stored
    ? JSON.parse(stored)
    : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
} catch (error) { /* the default is light */ }
</script>
</head>
<body class="bg-background text-foreground font-sans">
<div id="root" data-app="dashboard"></div>
<script type="module" src="/ui/assets/app.js"></script>
</body>
</html>
